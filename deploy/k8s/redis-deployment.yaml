apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtrace-redis
  namespace: backtrace-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtrace-redis
  template:
    metadata:
      labels:
        app: backtrace-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: backtrace-prod
spec:
  selector:
    app: backtrace-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
