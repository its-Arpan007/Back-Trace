apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtrace-worker
  namespace: backtrace-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backtrace-worker
  template:
    metadata:
      labels:
        app: backtrace-worker
    spec:
      containers:
        - name: worker
          image: gcr.io/backtrace-prod/backend:latest
          command: ["python", "-m", "app.engines.analytics_engine.engine"]
          envFrom:
            - configMapRef:
                name: backtrace-config
            - secretRef:
                name: backtrace-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
