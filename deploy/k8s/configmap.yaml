apiVersion: v1
kind: ConfigMap
metadata:
  name: backtrace-config
  namespace: backtrace-prod
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DIAGNOSIS_SLA_MS: "300"
  MASTERY_SLA_MS: "100"
  RECOMMENDATION_SLA_MS: "300"
  ANALYTICS_SLA_MS: "500"
