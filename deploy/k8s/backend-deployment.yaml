apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtrace-backend
  namespace: backtrace-prod
  labels:
    app: backtrace-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backtrace-backend
  template:
    metadata:
      labels:
        app: backtrace-backend
    spec:
      containers:
        - name: backend
          image: gcr.io/backtrace-prod/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backtrace-config
            - secretRef:
                name: backtrace-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backtrace-prod
spec:
  selector:
    app: backtrace-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
