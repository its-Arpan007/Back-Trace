name: BACKTRACE Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Quality Gate & Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pydantic sqlalchemy fastapi

      - name: Run Python Compilation Verification
        run: |
          python -m py_compile backend/app/main.py

      - name: Run Backend Unit & API Tests
        run: |
          pytest backend/tests/

  frontend-quality-gate:
    name: Frontend Flutter Quality Gate & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Flutter Widget & Router Tests
        run: |
          cd frontend
          flutter test
