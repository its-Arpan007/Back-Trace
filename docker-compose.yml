version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtrace_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=backtrace_user
      - POSTGRES_PASSWORD=backtrace_password_secure
      - POSTGRES_DB=backtrace_db
      - DATABASE_URL=postgresql+asyncpg://backtrace_user:backtrace_password_secure@db:5432/backtrace_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=backtrace_super_secret_key_change_in_production_environment_32chars_min
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backtrace_network

  db:
    image: postgres:16-alpine
    container_name: backtrace_db
    restart: always
    environment:
      POSTGRES_USER: backtrace_user
      POSTGRES_PASSWORD: backtrace_password_secure
      POSTGRES_DB: backtrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtrace_user -d backtrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backtrace_network

  redis:
    image: redis:7-alpine
    container_name: backtrace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backtrace_network

volumes:
  postgres_data:
  redis_data:

networks:
  backtrace_network:
    driver: bridge
